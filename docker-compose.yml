services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - invoice_network

  postgres:
    image: postgres:16
    container_name: invoice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: invoices
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d invoices"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - invoice_network

  node:
    image: node:20-alpine
    container_name: invoice_node
    working_dir: /var/www
    volumes:
      - .:/var/www
      - node_modules:/var/www/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
    restart: unless-stopped
    networks:
      - invoice_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice_worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - invoice_network

  nginx:
    image: nginx:alpine
    container_name: invoice_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - invoice_network

volumes:
  pgdata:
  node_modules:

networks:
  invoice_network:
    driver: bridge
