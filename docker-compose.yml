services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - invoice_network

  postgres:
    image: postgres:16
    container_name: invoice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: invoices
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d invoices"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - invoice_network

  nginx:
    image: nginx:alpine
    container_name: invoice_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - invoice_network

volumes:
  pgdata:

networks:
  invoice_network:
    driver: bridge
